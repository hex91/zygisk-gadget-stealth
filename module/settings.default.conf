# ============================================================
#  zygisk-gadget-stealth 配置
#  位置: /data/local/tmp/.gsys/settings.conf
#  改完执行: sh /data/adb/modules/zygisk_gadget_stealth/gadget_ctl.sh reload
#  然后 force-stop 并重启目标 App 即可生效（不用重启手机）
# ============================================================

# 全局总开关（0 = 完全不注入）
enabled=1

# 注入模式
#   script  = 无监听端口，App 启动自动执行 hook.js（最隐蔽，推荐）
#   listen  = 监听 127.0.0.1:<port>，可用 frida -H 交互调试
mode=script

# listen 模式端口（避开 frida-server 的 27042/39527）
port=27052

# 注入延迟（毫秒），让 App 启动期的完整性检查先跑完
delay_ms=1200

# 伪装后的 gadget so 文件名（不要带 frida/gadget 字样）
lib_name=libgcore.so
lib_name32=libgcore32.so

# ---------------- 去特征开关 ----------------
# 把 gadget so 的 /proc/<pid>/maps 段重映射成匿名内存（抹掉文件路径）
hide_maps=1
# 把 Zygisk 模块自身 so 也匿名化（实验性，有问题就关掉）
hide_module_map=0
# 伪装 gum-js-loop / frida-gadget / gmain / gdbus 线程名
hide_threads=1
# 不向 logcat 输出任何内容（调试时改 0）
no_log=1
# 在 App 私有目录写 .gs_state.<pid> 供状态面板读取
write_state=1
# 伪装后的线程名；auto = 从一组真实 ART/App 线程名里轮换（推荐）
# 填自定义字符串则使用 "<前7字符>-<tid>" 形式
thread_alias=auto

# ---------------- 注入目标 ----------------
# 格式: target=<包名>,<enabled 0|1>,<delay_ms>
# 可写多行；也可以用 gadget_ctl.sh add/del/enable/disable 管理
target=com.hex91.appinspector,1,1200
